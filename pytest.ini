[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --strict-markers

# starlette, TestClient için httpx yerine httpx2 öneriyor.
# Mevcut httpx sürümü sorunsuz çalışıyor; uyarı çıktıyı kirletmesin.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
