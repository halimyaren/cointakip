# GitGuardian / ggshield yapılandırması
# =====================================
#
# NEDEN VAR: GitGuardian'ın "Generic High Entropy Secret" dedektörü, rastgele
# görünen 32+ karakterlik her dizgeyi gizli veri sanır. Bu depo bir kripto
# portföy takipçisi olduğu için içinde kaçınılmaz olarak **herkese açık zincir
# adresleri** bulunur: token kontratları, mint adresleri, program kimlikleri.
# Bunlar tanımı gereği kamuya açıktır ve onlarla hiçbir şey harcanamaz.
#
# 31 Ağustos 2026'da bu yüzden iki yanlış alarm üretildi (commit b712b09).
#
# TASARIM KARARI: Dedektör KAPATILMADI. Kapatmak, ileride gerçekten sızan bir
# API anahtarını da susturur ve elimizde hiçbir koruma kalmazdı. Bunun yerine
# yalnızca aşağıda tek tek sayılan dizgeler muaf tutuluyor; listede olmayan
# yeni bir yüksek entropili dizge yine uyarı üretir.
#
# Aynı gerekçe projede daha önce de uygulandı: eksik uyarı sorunu gizler,
# fazla uyarı sorunu gürültüde kaybettirir. (bkz. bağlantı notu seviyeleri)
#
# ASLA MUAF TUTULMAYACAK YERLER: `data/` ve `borsa_exports/` klasörleri. Gerçek
# anahtarlar ve finansal veri oradadır; ikisi de `.gitignore` kapsamındadır ve
# taranmaları ENGELLENMEMELİDİR. Bu dosyaya yol tabanlı muafiyet eklemeyin.
#
# YENİ BİR MUAFİYET EKLEMEK: dizgenin gerçekten kamuya açık olduğunu doğrulayın
# (zincir gezgininde arayın), sonra karşılığını hesaplayıp buraya adıyla ve
# kısa gerekçesiyle ekleyin:
#     python -c "import hashlib;print(hashlib.sha256(b'DIZGE').hexdigest())"
#
# YEREL TARAMA (isteğe bağlı): `pip install ggshield` sonrası
#     ggshield secret scan repo .
# Bu dosya ggshield'in yerel ve CI taramalarını yönetir. GitGuardian panelinde
# zaten açılmış olan olaylar buradan kapanmaz; onlar panelden "false positive"
# olarak işaretlenir.

version: 2

